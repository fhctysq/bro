name: Build App

on:
  push:
    branches:
      - main  # назва головної гілки
    paths:
      - 'king.cs'
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build
      run: dotnet publish -c Release -r win-x64 --self-contained false -o ./output /p:PublishReadyToRun=true /p:OptimizationPreference=Size
    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: GeminiApp-Windows
        path: ./output
